# STAGING-ONLY pending-transfer candidate. No namespace is created here.
# Do not deploy until source/target parity and the transfer acceptance plan pass.
name = "eliza-cloud-admission-staging"
main = "src/index.ts"
account_id = "23cf6feaeaa541f6a0675053c33da768"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
tsconfig = "../api/tsconfig.json"

[observability]
enabled = true

# The existing source uses declarative exports. Legacy migrations cannot be mixed in.
# No self-binding is legal during pending transfer. Add it only after commit.
[exports.InferenceAdmissionGate]
type = "durable-object"
state = "expecting-transfer"
storage = "sqlite"
transfer_from = "eliza-cloud-api-staging"

[vars]
NODE_ENV = "production"
ENVIRONMENT = "staging"
INFERENCE_OPTIMISTIC_BILLING = "true"
SAFE_BALANCE_THRESHOLD = "5.00"
INFERENCE_BILLING_LEDGER = "db"
INFERENCE_DEFERRED_ADMISSION = "true"
INFERENCE_HOT_PATH_CACHES = "true"
INFERENCE_AUTH_CACHE_ENABLED = "true"
INFERENCE_STRONG_REVOCATION_ENABLED = "true"
INFERENCE_SNAPSHOT_ADMISSION_ENABLED = "true"
INFERENCE_PASSTHROUGH_STREAMING = "true"
INFERENCE_PASSTHROUGH_EMBEDDINGS = "true"
# Source leaves funded admission unset; target preserves its disabled default.
# Never enable it or invent a seal while preparing this split.

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "ef65eb94c74144a3a3848ad1945571fb"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "f7e24faaff734e7c8cd8e12b093c3571"
